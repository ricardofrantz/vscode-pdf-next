name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag name to package for a dry run or guarded manual release.
        required: true
        default: v2.0.2
      dry_run:
        description: Verify and package only; skip GitHub Release and registry publishing.
        type: boolean
        default: true
      confirm_publish:
        description: Type "publish <tag>" to allow GitHub Release, Marketplace, and Open VSX publishing when dry_run is false.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag_commit: ${{ steps.validate_release.outputs.tag_commit }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2

      - name: Validate release tag and package version
        id: validate_release
        run: |
          git fetch --force --tags
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "RELEASE_TAG '$RELEASE_TAG' is not a valid v<major>.<minor>.<patch>[-prerelease] tag."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$HEAD_COMMIT" != "$TAG_COMMIT" ]; then
            echo "Checked-out commit $HEAD_COMMIT does not match $RELEASE_TAG ($TAG_COMMIT)."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match release tag $RELEASE_TAG."
            exit 1
          fi
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run package:scan:test
          xvfb-run -a bun run test

      - name: Package VSIX
        run: |
          VERSION="${RELEASE_TAG#v}"
          bun run package -- --out "pdf-preview-next-${VERSION}.vsix"
          node ./tools/scan_vsix.mjs "pdf-preview-next-${VERSION}.vsix"

      - name: Audit production dependencies
        run: |
          mkdir -p audit-prod
          cp package.json bun.lock audit-prod/
          cd audit-prod
          bun install --frozen-lockfile --production
          bun audit --audit-level=high

      - name: Upload VSIX artifact for guarded publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-preview-next-vsix
          path: pdf-preview-next-*.vsix
          if-no-files-found: error

      - name: Note release verification-only run
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == true || inputs.confirm_publish != format('publish {0}', inputs.release_tag) }}
        run: |
          echo "Verification completed for $RELEASE_TAG; GitHub Release and registry publishing were skipped."

  missing-publish-confirmation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.confirm_publish != format('publish {0}', inputs.release_tag) }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unconfirmed publishing
        run: |
          echo "Refusing to publish $RELEASE_TAG. Re-run with dry_run=false and confirm_publish='publish $RELEASE_TAG'."
          exit 1

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.confirm_publish == format('publish {0}', inputs.release_tag) }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Configure this environment with required reviewers in GitHub repository settings.
    environment:
      name: marketplace-publish
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release.outputs.tag_commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2

      - name: Re-verify release tag after approval
        run: |
          git fetch --force --tags
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$TAG_COMMIT" != "${{ needs.release.outputs.tag_commit }}" ]; then
            echo "$RELEASE_TAG moved from ${{ needs.release.outputs.tag_commit }} to $TAG_COMMIT after verification."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${{ needs.release.outputs.tag_commit }}" ]; then
            echo "Publish checkout does not match verified commit."
            exit 1
          fi

      - name: Install locked publish tooling
        run: bun install --frozen-lockfile

      - name: Download VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdf-preview-next-vsix
          path: .

      - name: Verify downloaded VSIX
        run: |
          VSIX="$(ls pdf-preview-next-*.vsix | head -n 1)"
          node ./tools/scan_vsix.mjs "$VSIX"

      - name: Upload GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX="$(ls pdf-preview-next-*.vsix | head -n 1)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$VSIX" --clobber
          else
            gh release create "$RELEASE_TAG" "$VSIX" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VS Code Marketplace publish skipped: VSCE_PAT is not configured."
            exit 0
          fi
          VSIX="$(ls pdf-preview-next-*.vsix | head -n 1)"
          ./node_modules/.bin/vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Open VSX publish skipped: OVSX_PAT is not configured."
            exit 0
          fi
          VSIX="$(ls pdf-preview-next-*.vsix | head -n 1)"
          ./node_modules/.bin/ovsx publish "$VSIX" -p "$OVSX_PAT"
