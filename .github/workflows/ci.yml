name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / VS Code ${{ matrix.vscode-version }}
    strategy:
      # One failing platform/version should not hide results from the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 1.95.0 is the engines.vscode floor; stable catches drift against
        # the latest VS Code/Electron runtime.
        vscode-version: ['1.95.0', 'stable']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Compile test runtime
        run: bun run compile

      - name: Check PDF.js runtime compatibility
        run: bun run test:compat

      - name: Test VSIX scanner
        run: bun run package:scan:test

      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a bun run test

      - name: Test (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: bun run test

      - name: Audit production dependencies
        # Platform-independent; run once per workflow.
        if: runner.os == 'Linux' && matrix.vscode-version == 'stable'
        shell: bash
        run: |
          # This extension ships with no runtime npm dependencies (viewer assets are vendored).
          # Do not fail CI on advisories that only affect publish/dev tooling (@vscode/vsce, eslint, …).
          HAS_PROD="$(node -p "const d=require('./package.json').dependencies||{}; Object.keys(d).length > 0 ? 'yes' : 'no'")"
          if [ "$HAS_PROD" = "no" ]; then
            echo "No production dependencies declared; skipping production audit."
            exit 0
          fi
          mkdir -p audit-prod
          cp package.json bun.lock audit-prod/
          cd audit-prod
          bun install --frozen-lockfile --production
          bun audit --audit-level=high

      - name: Package VSIX
        run: bun run package -- --out pdf-preview-next-ci.vsix

      - name: Scan VSIX contents
        run: node ./tools/scan_vsix.mjs pdf-preview-next-ci.vsix
